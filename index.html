<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href = "style.css" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
    <script src="app.js"></script>
</head>
<body>

    <header class = "header">  <!--esse é o cabeçalho do codigo-->
        
        <a href = "#"> <!--O a é uma espécie de link-->
            <img src = "images.jpg">
        </a>

        <nav> <!-- nav é basicamente navegação tipo você clica e é mandado pra algum lugar -->

            <a href = "#"> Big Sword </a>
             <a href = "#"> Great Sword </a>
              <a href = "#"> Sword </a>
        </nav> 
        <button class = "cart">  <!-- button é botão -->
            ⚒️
            <span class = "cart-cont"></span> <!-- é inline praticamente pode colocar um do lado do outro sem precisar ir em baixo-->

        </button>

    </header>

    <main class = "container"> <!-- main significa principal-->

        <section class = "product"> <!-- é a forma generica de representar a div e serve para selecionar um produto -->

        <div class = "product-visual">

            <model-viewer src = assets\stylized_big_sword.glb class = "model"  
            auto-rotate 
            camera-controls>

            </model-viewer> <!-- serve pra vizualizar o modelo escolhido -->
        
        </div>

        </section>

    </main>

</body>
</html>
